<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Primer Juego Web</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0f172a;
            color: white;
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
            touch-action: none;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center h-screen m-0">

    <div class="text-center mb-4">
        <h1 class="text-3xl font-black text-cyan-400 tracking-wider">SPACE DODGER</h1>
        <p class="text-sm text-slate-400">Esquiva los asteroides espaciales</p>
    </div>

    <div class="relative shadow-2xl shadow-cyan-500/20 rounded-xl overflow-hidden border-2 border-cyan-500/40">
        <canvas id="gameCanvas" width="400" height="600" class="block bg-slate-950"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Objeto de la nave espacial
        const player = {
            x: canvas.width / 2 - 20,
            y: canvas.height - 80,
            width: 40,
            height: 40,
            speed: 6
        };

        // Variables del juego
        let obstacles = [];
        let score = 0;
        let gameOver = false;
        let frameCount = 0;

        // Control de teclas
        const keys = { ArrowLeft: false, ArrowRight: false, a: false, d: false };

        window.addEventListener('keydown', (e) => {
            if (keys.hasOwnProperty(e.key) || keys.hasOwnProperty(e.key.toLowerCase())) {
                keys[e.key] = true;
                keys[e.key.toLowerCase()] = true;
            }
            // Reiniciar con espacio si perdió
            if (e.key === ' ' && gameOver) {
                resetGame();
            }
        });

        window.addEventListener('keyup', (e) => {
            if (keys.hasOwnProperty(e.key) || keys.hasOwnProperty(e.key.toLowerCase())) {
                keys[e.key] = false;
                keys[e.key.toLowerCase()] = false;
            }
        });

        // Controles táctiles y de mouse
        function movePlayer(clientX) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const canvasX = (clientX - rect.left) * scaleX;
            player.x = canvasX - player.width / 2;
        }

        canvas.addEventListener('mousemove', (e) => { if (!gameOver) movePlayer(e.clientX); });
        canvas.addEventListener('touchmove', (e) => {
            if (!gameOver && e.touches.length > 0) movePlayer(e.touches[0].clientX);
        }, { passive: true });

        // Clic en pantalla para reiniciar si perdió
        canvas.addEventListener('click', () => {
            if (gameOver) resetGame();
        });

        function resetGame() {
            obstacles = [];
            score = 0;
            frameCount = 0;
            player.x = canvas.width / 2 - player.width / 2;
            gameOver = false;
            loop();
        }

        // Generar asteroides aleatorios
        function spawnObstacle() {
            const size = Math.random() * 20 + 20; // Tamaño entre 20 y 40
            const x = Math.random() * (canvas.width - size);
            const speed = Math.random() * 3 + 3;  // Velocidad de caída
            obstacles.push({ x, y: -size, width: size, height: size, speed });
        }

        // Colisión tipo Caja (AABB)
        function checkCollision(rect1, rect2) {
            return (
                rect1.x < rect2.x + rect2.width &&
                rect1.x + rect1.width > rect2.x &&
                rect1.y < rect2.y + rect2.height &&
                rect1.y + rect1.height > rect2.y
            );
        }

        // Actualizar lógica
        function update() {
            if (gameOver) return;

            // Movimiento de la nave
            if (keys.ArrowLeft || keys.a) player.x -= player.speed;
            if (keys.ArrowRight || keys.d) player.x += player.speed;

            // Limites del canvas
            if (player.x < 0) player.x = 0;
            if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

            // Generar asteroides cada ciertos cuadros
            frameCount++;
            if (frameCount % 45 === 0) {
                spawnObstacle();
            }

            // Mover asteroides y verificar colisiones
            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].y += obstacles[i].speed;

                // Verificar si colisiona con la nave
                if (checkCollision(player, obstacles[i])) {
                    gameOver = true;
                }

                // Eliminar asteroides que salen de la pantalla y sumar puntos
                if (obstacles[i].y > canvas.height) {
                    obstacles.splice(i, 1);
                    score += 10;
                }
            }
        }

        // Dibujar elementos
        function draw() {
            // Fondo
            ctx.fillStyle = '#030712';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Dibujar asteroides (Rojos / Naranjas amenazantes)
            ctx.fillStyle = '#f43f5e';
            ctx.shadowColor = '#f43f5e';
            ctx.shadowBlur = 10;
            obstacles.forEach(obs => {
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
            });

            // Dibujar la nave (Cyan futurista)
            ctx.fillStyle = '#22d3ee';
            ctx.shadowColor = '#22d3ee';
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.moveTo(player.x + player.width / 2, player.y);
            ctx.lineTo(player.x, player.y + player.height);
            ctx.lineTo(player.x + player.width, player.y + player.height);
            ctx.closePath();
            ctx.fill();

            ctx.shadowBlur = 0;

            // Dibujar Puntuación en pantalla
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 20px monospace';
            ctx.fillText(`PUNTOS: ${score}`, 20, 35);

            // Pantalla de Game Over
            if (gameOver) {
                ctx.fillStyle = 'rgba(3, 7, 18, 0.85)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#f43f5e';
                ctx.font = 'bold 36px monospace';
                ctx.textAlign = 'center';
                ctx.fillText('¡GAME OVER!', canvas.width / 2, canvas.height / 2 - 30);

                ctx.fillStyle = '#94a3b8';
                ctx.font = '16px monospace';
                ctx.fillText(`Puntuación final: ${score}`, canvas.width / 2, canvas.height / 2 + 10);
                ctx.fillText('Toca o presiona ESPACIO para reintentar', canvas.width / 2, canvas.height / 2 + 50);
                ctx.textAlign = 'left'; // Resetear alineación
            }
        }

        // Bucle principal
        function loop() {
            update();
            draw();
            if (!gameOver) {
                requestAnimationFrame(loop);
            }
        }

        loop();
    </script>
</body>
</html>
